<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Intercession Watchmen</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/styles.css?v=4" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div id="app" class="shell container-fluid px-3 px-sm-4">
      <header class="top d-flex justify-content-between align-items-start gap-3 mb-3">
        <div>
          <p class="brand mb-1">Intercession Watchmen</p>
          <p id="userLine" class="user-line mb-0">Loading…</p>
        </div>
        <span id="roleBadge" class="badge rounded-pill role-badge">—</span>
      </header>

      <nav
        id="nav"
        class="nav nav-pills flex-nowrap gap-2 mb-3 overflow-auto pb-1"
        aria-label="Sections"
      ></nav>

      <main id="main" class="main d-grid gap-3"></main>

      <p class="claim mb-0 mt-4" aria-hidden="true">Experience Church</p>

      <div
        id="toast"
        class="toast align-items-center border-0 position-fixed bottom-0 start-50 translate-middle-x mb-4"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
        hidden
      >
        <div class="d-flex">
          <div id="toastBody" class="toast-body"></div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script type="module" src="/app.js?v=3"></script>
  </body>
</html>
